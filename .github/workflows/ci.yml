name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint
      
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # - name: Run migrate:templeboyer (optional, heavy & network-dependent)
      #   run: npm run migrate:templeboyer
